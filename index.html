<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="UBE MATRIX SWARM — Predict. Adapt. Evolve. — Work in Project. Sito ufficiale in preparazione.">
  <meta name="robots" content="index,follow">
  <title>UBE MATRIX SWARM | Work in Project</title>
  <link rel="icon" id="ube-favicon" type="image/png" href="./landing-approved.png">
  <script>
    (() => {
      const artwork = new Image();
      artwork.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const context = canvas.getContext('2d');
        if (!context) return;
        // Ritaglio dei quattro cubi originali dal rendering approvato.
        context.drawImage(artwork, 210, 320, 350, 350, 0, 0, 128, 128);
        document.getElementById('ube-favicon').href = canvas.toDataURL('image/png');
      };
      artwork.src = './landing-approved.png';
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html,body { min-height:100%; margin:0; background:#000; }
    body { font-family:Arial, Helvetica, sans-serif; color:#fff; }
    main { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; background:#000; }
    .hero { display:block; width:100%; max-width:2172px; height:auto; object-fit:contain; }
    .mobile-note { display:none; padding:1.25rem 1.5rem 2rem; text-align:center; letter-spacing:.13em; text-transform:uppercase; }
    .mobile-note strong { display:block; font-size:clamp(1.1rem,5vw,2rem); line-height:1.4; }
    .mobile-note span { display:block; color:#efb3ff; font-size:.75rem; margin-top:.8rem; }
    @media(max-width:680px) {
      main { justify-content:center; }
      .hero { width:154%; max-width:none; flex:none; transform:translateX(0); }
      .mobile-note { display:block; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; } }
  .approved-hero{display:block;width:100%;max-width:1672px;height:auto;object-fit:contain}
    @media(max-width:680px){.approved-hero{width:100%;max-width:100%}}
  </style>
</head>
<body>
  <main aria-label="Pagina provvisoria UBE MATRIX SWARM">
    <img class="approved-hero" src="./landing-approved.png?v=zg-property-20261116" width="1672" height="941" fetchpriority="high" alt="Logo istituzionale Z&G PROPERTY DEVELOPMENT CO., UBE MATRIX SWARM, Predict Adapt Evolve, look beyond, WORK IN PROJECT" />
    <div class="mobile-note" aria-hidden="true"><strong>UBE MATRIX SWARM</strong><span>Work in Project</span></div>
  </main>
</body>
</html>
